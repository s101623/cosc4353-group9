<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QueueSmart - Admin Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
     <link rel="stylesheet" href="css/admin-screens.css">

</head>
<body>
    <header>
      <h2>QueueSmart</h2>
        <button type="button" class="logout" id="logout">Log Out</button>
  </header>

    <div class="admin-layout">
        <nav class="sidebar">
            <a href="admin-dashboard.html" aria-current="page">Dashboard</a>
            <a href="service-management.html">Service Management</a>
            <a href="queue-management.html">Manage Queues</a>
        </nav>

     <main>
        <h1>Admin Dashboard</h1>
          <section>
               <h2>Service Overview</h2>

               <form id="service-filters" class="filter-bar">
                   <div class="field filter-search">
                       <label for="filter-search">Search</label>
                       <input type="search" id="filter-search" placeholder="Service name or description">
                   </div>
                   <div class="field">
                       <label for="filter-category">Service type</label>
                       <select id="filter-category">
                           <option value="">All types</option>
                       </select>
                   </div>
                   <div class="field">
                       <label for="filter-status">Status</label>
                       <select id="filter-status">
                           <option value="">All statuses</option>
                           <option value="open">Open</option>
                           <option value="closed">Closed</option>
                       </select>
                   </div>
                   <div class="field">
                       <label for="filter-priority">Priority</label>
                       <select id="filter-priority">
                           <option value="">All priorities</option>
                           <option value="high">High</option>
                           <option value="medium">Medium</option>
                           <option value="low">Low</option>
                       </select>
                   </div>
                   <div class="field">
                       <label for="sort-services">Sort by</label>
                       <select id="sort-services">
                           <option value="name">Name (A-Z)</option>
                           <option value="waiting">Most waiting</option>
                           <option value="priority">Highest priority</option>
                           <option value="duration">Shortest duration</option>
                       </select>
                   </div>
               </form>

               <div class="filter-summary">
                   <p id="service-count" aria-live="polite"></p>
                   <button type="button" id="clear-filters" class="button-secondary">Clear Filters</button>
               </div>

              <div id="service-list">
                   <!-- services are grouped by type and displayed from the backend API -->
                 </div>
          </section>
        </main>
    </div>

    <script src="js/mock-data.js"></script>
    <script src="js/logout.js"></script>
    <script src="js/admin-dashboard.js"></script>
</body>
</html>
