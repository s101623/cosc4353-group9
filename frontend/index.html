<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QueueSmart - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <h1>Login</h1>

        <form id="login-form" novalidate>
            <div class="field">
                <label for="login-id">Email, Username, or Driver's License #:</label>
                <!-- max email length is 254 char -->
                <input type="text" id="login-id" name="login-id" required maxlength="254" autocomplete="username">
                <span class="error" id="login-id-error"></span>
            </div>

            <div class="field">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required maxlength="64" autocomplete="current-password">
                <span class="error" id="password-error"></span>
            </div>

            <button type="submit">Log In</button>
            <p class="error" id="form-message"></p>
        </form>

        <p><a href="forgot-password.html">Forgot password?</a></p>
        <p>New visitor? <a href="register.html">Create an account</a></p>
    </main>

    <script src="js/mock-data.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
