<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QueueSmart - Queue Management</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin-screens.css">
</head>
<body>
    <header>
        <h2>QueueSmart</h2>
        <a href="index.html" class="logout" id="logout">Log Out</a>
    </header>

    <div class="admin-layout">
        <nav class="sidebar">
            <a href="admin-dashboard.html">Dashboard</a>
            <a href="service-management.html">Service Management</a>
            <a href="queue-management.html" aria-current="page">Manage Queues</a>
        </nav>

        <main>
            <h1>Queue Management</h1>

            <section>
                <h2>Select Service</h2>

                <div class="field">
                    <label for="queue-service">Service:</label>
                    <select id="queue-service">
                        <!-- Services will be added using mock data -->
                    </select>
                </div>
            </section>

            <section>
                <h2>Current Queue</h2>

                <p id="queue-summary"></p>

                <div id="queue-list">
                    <!-- Visitors in the selected queue will be displayed here -->
                </div>

                <button type="button" id="serve-next">Serve Next</button>
            </section>
        </main>
    </div>

    <script src="js/mock-data.js"></script>
    <script src="js/logout.js"></script>
    <script src="js/queue-management.js"></script>
</body>
</html>
