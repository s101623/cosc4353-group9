<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QueueSmart - Forgot Password</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin-screens.css">
    <link rel="stylesheet" href="css/auth-screens.css">
</head>
<body>
    <header>
        <h2>QueueSmart</h2> <p>Account Recovery</p>
    </header>

    <main>
        <h1>Forgot Password</h1>

        <section>
            <!-- Default: recover with email + date of birth -->
            <form id="email-form" novalidate>
                <p>Enter your email and date of birth to reset your password.</p>

                <div class="field">
                    <label for="reset-email">Email:</label>
                    <input type="email" id="reset-email" name="reset-email" required maxlength="254" autocomplete="email">
                    <span class="error" id="reset-email-error"></span>
                </div>

                <div class="field">
                    <label for="email-dob">DOB (Date of Birth):</label>
                    <input type="text" id="email-dob" name="email-dob" required inputmode="numeric" maxlength="10" placeholder="MM/DD/YYYY" data-format="mm/dd/yyyy" data-min="1900-01-01" data-before-today autocomplete="bday">
                    <span class="error" id="email-dob-error"></span>
                </div>

                <button type="submit">Reset Password</button>
                <p><a href="#" id="show-license-form">Forgot your email? Use your driver's license # instead</a></p>
            </form>

            <!-- If the email is forgotten: recover with driver's license + date of birth -->
            <form id="license-form" novalidate hidden>
                <p>Enter your driver's license number and date of birth to reset your password.</p>

                <div class="field">
                    <label for="reset-license">Driver's License #:</label>
                    <input type="text" id="reset-license" name="reset-license" required inputmode="numeric" maxlength="8" pattern="[0-9]{1,8}" title="Driver's license number can only contain numbers" data-format="digits" autocomplete="off">
                    <span class="error" id="reset-license-error"></span>
                </div>

                <div class="field">
                    <label for="license-dob">DOB (Date of Birth):</label>
                    <input type="text" id="license-dob" name="license-dob" required inputmode="numeric" maxlength="10" placeholder="MM/DD/YYYY" data-format="mm/dd/yyyy" data-min="1900-01-01" data-before-today autocomplete="bday">
                    <span class="error" id="license-dob-error"></span>
                </div>

                <button type="submit">Reset Password</button>
                <p><a href="#" id="show-email-form">Use your email instead</a></p>
            </form>

            <p id="form-message"></p>

            <p><a href="index.html">Back to login</a></p>
        </section>
    </main>

    <script src="js/validation.js"></script>
    <script src="js/forgot-password.js"></script>
</body>
</html>
