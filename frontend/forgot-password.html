<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QueueSmart - Forgot Password</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <h1>Forgot Password</h1>

        <!-- Default: recover with email + date of birth -->
        <form id="email-form" novalidate>
            <p>Enter your email and date of birth to reset your password.</p>

            <div class="field">
                <label for="reset-email">Email:</label>
                <input type="email" id="reset-email" name="reset-email" required maxlength="254" autocomplete="email">
                <span class="error" id="reset-email-error"></span>
            </div>

            <div class="field">
                <label for="email-dob">DOB (Date of Birth):</label>
                <input type="text" id="email-dob" name="email-dob" required inputmode="numeric" maxlength="10" placeholder="MM/DD/YYYY" data-format="mm/dd/yyyy" data-min="1900-01-01" data-before-today autocomplete="bday">
                <span class="error" id="email-dob-error"></span>
            </div>

            <button type="submit">Reset Password</button>
            <p><a href="#" id="show-username-form">Forgot your email? Use your username instead</a></p>
        </form>

        <!-- If the email is forgotten: recover with username + date of birth -->
        <form id="username-form" novalidate hidden>
            <p>Enter your username and date of birth to reset your password.</p>

            <div class="field">
                <label for="reset-username">Username:</label>
                <input type="text" id="reset-username" name="reset-username" required minlength="3" maxlength="20" pattern="(?=.*[A-Za-z])(?=.*[0-9])(?=.*[^A-Za-z0-9\s])\S+" title="Username must include at least one letter, one number, and one special character, with no spaces." autocomplete="username">
                <span class="error" id="reset-username-error"></span>
            </div>

            <div class="field">
                <label for="username-dob">DOB (Date of Birth):</label>
                <input type="text" id="username-dob" name="username-dob" required inputmode="numeric" maxlength="10" placeholder="MM/DD/YYYY" data-format="mm/dd/yyyy" data-min="1900-01-01" data-before-today autocomplete="bday">
                <span class="error" id="username-dob-error"></span>
            </div>

            <button type="submit">Reset Password</button>
            <p><a href="#" id="show-email-form">Forgot your username? Use your email instead</a></p>
        </form>

        <p id="form-message"></p>

        <p><a href="index.html">Back to login</a></p>
    </main>

    <script src="js/validation.js"></script>
    <script src="js/forgot-password.js"></script>
</body>
</html>
